<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইবুক মেকার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>ইবুক মেকার</h1>
  <nav>
    <button id="btnNew" class="ghost">নতুন বই</button>
    <button id="btnRead" class="ghost">বই পড়ুন</button>
    <button id="btnOpen" class="ghost">প্রজেক্ট খুলুন</button>
    <button id="btnSave" class="ghost">প্রজেক্ট সেভ</button>
    <button id="btnPreview" class="ghost">প্রিভিউ</button>
    <button id="btnEpub" class="primary">EPUB তৈরি করুন</button>
  </nav>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <input type="file" id="fileRead" accept=".epub,.pdf,application/epub+zip,application/pdf" hidden>
</header>

<main class="layout">
  <aside class="side">
    <section>
      <h2>বইয়ের তথ্য</h2>
      <label>বইয়ের নাম<input id="mTitle" type="text"></label>
      <label>লেখক<input id="mAuthor" type="text"></label>
      <label>ভাষা
        <select id="mLang">
          <option value="bn">বাংলা</option>
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </label>
      <label>সংক্ষিপ্ত বিবরণ<textarea id="mDesc" rows="3"></textarea></label>
      <div class="cover">
        <div id="coverBox" class="coverBox">কভার নেই</div>
        <div class="row">
          <button id="btnCover" class="ghost">কভার বাছুন</button>
          <button id="btnCoverDel" class="ghost">সরান</button>
        </div>
        <input type="file" id="fileCover" accept="image/*" hidden>
      </div>
    </section>
    <section>
      <div class="row between"><h2>অধ্যায়</h2><button id="btnAdd" class="ghost">+ নতুন</button></div>
      <ol id="chapters" class="chapters"></ol>
    </section>
  </aside>

  <section class="editor">
    <input id="cTitle" class="chTitle" type="text" placeholder="অধ্যায়ের নাম">
    <div id="modeBar" class="modeBar" role="group" aria-label="লেখার ধরন">
      <button type="button" data-mode="html" title="রং, বোল্ড, ইটালিক ইত্যাদি সহ ফরম্যাটেড লেখা">এইচটিএমএল</button>
      <button type="button" data-mode="text" title="কোনো ফরম্যাট ছাড়া সাধারণ লেখা">সাধারণ টেক্সট</button>
    </div>
    <div id="tocBar" class="tocBar" hidden>
      <label class="chk"><input id="tocOn" type="checkbox"> বইয়ে সূচিপত্র পেজ রাখুন</label>
      <label>সূচিপত্র তৈরির ধরন
        <select id="tocMode">
          <option value="auto">স্বয়ংক্রিয় (অধ্যায়ের নাম থেকে)</option>
          <option value="manual">নিজে লিখব</option>
        </select>
      </label>
    </div>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="ফরম্যাটিং">
      <button data-cmd="bold" title="বোল্ড"><b>B</b></button>
      <button data-cmd="italic" title="ইটালিক"><i>I</i></button>
      <button data-cmd="underline" title="আন্ডারলাইন"><u>U</u></button>
      <span class="sep"></span>
      <span class="clrs" role="group" aria-label="লেখার রং">
        <button class="sw" data-color="#d32f2f" style="background:#d32f2f" title="লাল" aria-label="লাল"></button>
        <button class="sw" data-color="#1565c0" style="background:#1565c0" title="নীল" aria-label="নীল"></button>
        <button class="sw" data-color="#2e7d32" style="background:#2e7d32" title="সবুজ" aria-label="সবুজ"></button>
        <button class="sw" data-color="#ef6c00" style="background:#ef6c00" title="কমলা" aria-label="কমলা"></button>
        <button class="sw" data-color="#6a1b9a" style="background:#6a1b9a" title="বেগুনি" aria-label="বেগুনি"></button>
        <label class="clr" title="অন্য রং বাছুন">রং <input type="color" id="fgColor" value="#1565c0"></label>
      </span>
      <button data-cmd="removeFormat" title="ফরম্যাট মুছুন">ফরম্যাট মুছুন</button>
      <span class="sep"></span>
      <button data-cmd="formatBlock" data-val="h1">শিরোনাম ১</button>
      <button data-cmd="formatBlock" data-val="h2">শিরোনাম ২</button>
      <button data-cmd="formatBlock" data-val="p">অনুচ্ছেদ</button>
      <button data-cmd="formatBlock" data-val="blockquote">উদ্ধৃতি</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList">তালিকা</button>
      <button data-cmd="insertOrderedList">ক্রমিক</button>
      <span class="sep"></span>
      <button data-cmd="justifyLeft">বাম</button>
      <button data-cmd="justifyCenter">মাঝ</button>
      <button data-cmd="justifyFull">সমান</button>
      <span class="sep"></span>
      <button id="btnImg" title="ছবি যোগ করুন">ছবি</button>
      <button id="btnSrc" title="এইচটিএমএল কোড দেখুন/লিখুন">&lt;/&gt; কোড</button>
      <span class="sep"></span>
      <button data-cmd="undo">আনডু</button>
      <button data-cmd="redo">রিডু</button>
    </div>
    <div id="imgBar" class="toolbar imgbar" hidden aria-label="ছবির অপশন">
      <button data-img="w" data-v="33%">ছোট</button>
      <button data-img="w" data-v="66%">মাঝারি</button>
      <button data-img="w" data-v="100%">পূর্ণ</button>
      <span class="sep"></span>
      <button data-img="al" data-v="left">বাম</button>
      <button data-img="al" data-v="center">মাঝ</button>
      <button data-img="al" data-v="right">ডান</button>
      <span class="sep"></span>
      <button data-img="cap">ক্যাপশন</button>
      <button data-img="alt">বিকল্প লেখা</button>
      <button data-img="del" class="danger">ছবি মুছুন</button>
    </div>
    <input type="file" id="fileImg" accept="image/*" multiple hidden>
    <div id="body" class="page" contenteditable="true" spellcheck="false" aria-label="অধ্যায়ের লেখা"></div>
    <textarea id="plain" class="page plain" hidden spellcheck="false" aria-label="সাধারণ টেক্সট" placeholder="এখানে সাধারণ টেক্সট লিখুন। ফাঁকা লাইন দিলে নতুন অনুচ্ছেদ হবে।"></textarea>
    <textarea id="srcBox" class="page plain src" hidden spellcheck="false" aria-label="এইচটিএমএল কোড"></textarea>
    <div class="status"><span id="stat"></span><span id="saved">অটো-সেভ চালু</span></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modalBar"><strong>প্রিভিউ</strong><button id="btnClose" class="ghost">বন্ধ করুন</button></div>
  <iframe id="frame" title="প্রিভিউ"></iframe>
</div>
<div id="reader" class="reader" hidden>
  <div class="rBar">
    <button id="rClose" class="ghost" aria-label="বন্ধ করুন">✕</button>
    <div class="rInfo"><strong id="rTitle"></strong><span id="rPos"></span></div>
    <button id="rMinus" class="ghost" aria-label="ছোট">A−</button>
    <button id="rPlus" class="ghost" aria-label="বড়">A+</button>
    <button id="rTheme" class="ghost">রং</button>
    <button id="rToc" class="ghost">সূচি</button>
  </div>
  <div class="rBody">
    <iframe id="rFrame" title="বই"></iframe>
    <div id="rPdf" class="rPdf" hidden></div>
    <aside id="rDrawer" class="rDrawer" hidden><ol id="rTocList"></ol></aside>
  </div>
  <div class="rNav"><button id="rPrev">‹ আগের</button><button id="rNext">পরের ›</button></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="lib/jszip.min.js" onerror="document.write('<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;><\/script>')"></script>
<script src="app.js"></script>
<script src="reader.js"></script>
</body>
</html>
