name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www/lib
          cp index.html style.css app.js reader.js www/
          cp node_modules/jszip/dist/jszip.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/

      - name: Create Android project
        run: |
          npx cap add android

      - name: Register app as EPUB/PDF viewer ("Open with")
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          filters = r'''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/epub+zip" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:host="*" />
                          <data android:mimeType="*/*" />
                          <data android:pathPattern=".*\\.epub" />
                          <data android:pathPattern=".*\\..*\\.epub" />
                          <data android:pathPattern=".*\\..*\\..*\\.epub" />
                      </intent-filter>
          '''
          assert '</activity>' in s
          s = s.replace('</activity>', filters + '        </activity>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ebook-maker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebook-maker-apk
          path: ebook-maker.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ebook-maker.apk
